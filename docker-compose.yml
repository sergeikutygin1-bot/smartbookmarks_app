services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartbookmarks_postgres
    environment:
      POSTGRES_USER: smartbookmarks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: smartbookmarks
    ports:
      - "5432:5432"
    volumes:
      - smart_bookmarks_v2_postgres_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbookmarks"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartbookmarks

  redis:
    image: redis:7-alpine
    container_name: smartbookmarks_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartbookmarks

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: smartbookmarks_jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartbookmarks

  prometheus:
    image: prom/prometheus:latest
    container_name: smartbookmarks_prometheus
    ports:
      - "9090:9090"  # Prometheus UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartbookmarks

  grafana:
    image: grafana/grafana:latest
    container_name: smartbookmarks_grafana
    ports:
      - "3001:3000"  # Grafana UI (mapped to 3001 to avoid conflict with frontend)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartbookmarks

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: smartbookmarks_backend
    ports:
      - "3002:3002"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/scripts:/app/scripts
      - backend_data:/app/.data
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://smartbookmarks:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/smartbookmarks
      - REDIS_URL=redis://redis:6379
      - PORT=3002
      - ENABLE_TRACING=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=smart-bookmarks-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma generate &&
             npm run dev"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smartbookmarks

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: smartbookmarks_worker
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/scripts:/app/scripts
      - backend_data:/app/.data
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://smartbookmarks:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/smartbookmarks
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    command: npm run worker:dev
    networks:
      - smartbookmarks

  ai-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartbookmarks_ai_worker
    volumes:
      - ./ai-service:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://smartbookmarks:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/smartbookmarks
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_MODEL=gpt-4o-mini-2024-07-18
      - EMBEDDING_MODEL=text-embedding-3-small
      - WORKER_CONCURRENCY=5
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    command: python -m worker
    restart: unless-stopped
    networks:
      - smartbookmarks

  graph-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: smartbookmarks_graph_worker
    command: npm run worker:graph
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/scripts:/app/scripts
      - backend_data:/app/.data
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://smartbookmarks:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/smartbookmarks
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_MODEL=gpt-4o-mini-2024-07-18
      - EMBEDDING_MODEL=text-embedding-3-small
      - WORKER_CONCURRENCY=3
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smartbookmarks

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: smartbookmarks_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/hooks:/app/hooks
      - ./frontend/store:/app/store
      - ./frontend/public:/app/public
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend-api:3002
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3002
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - smartbookmarks

volumes:
  # ⚠️ CRITICAL: External volume prevents 'docker-compose down -v' from deleting data
  # Volume contains all user data: bookmarks, users, entities, concepts, relationships
  # To backup: ./scripts/backup-database.sh
  # To restore: ./scripts/restore-backup.sh <backup-file>
  smart_bookmarks_v2_postgres_data:
    external: true  # NEVER REMOVE THIS LINE - Protects data from deletion
  redis_data:
  backend_data:
  prometheus_data:
  grafana_data:

networks:
  smartbookmarks:
    driver: bridge
